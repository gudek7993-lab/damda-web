<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#15181d">
<title>Damda</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="config.js" onerror="void 0"></script>
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url('https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2')}
:root{
  /* neutrals: one cool slate family */
  --bg:#15181d;--sf:#1d2127;--sf2:#262b33;--bd:#363c46;--tx:#e8eaed;--fa:#9aa3ae;
  /* the one action accent: terracotta */
  --ac:#e2714a;--ac-tx:#15181d;--ac-soft:rgba(226,113,74,.15);
  /* semantic only: ingredient classes + danger */
  --c-linear:#8cc79a;--c-damped:#e3b862;--c-liquid:#7fb0e6;--c-salt:#e58a9a;--c-fixed:#9aa3ae;
  --danger:#e5656b;--danger-soft:rgba(229,101,107,.12);
  /* shape rule: surfaces 14, controls 10, chips + round buttons full */
  --r-s:14px;--r-c:10px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
html{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
input[type=search]::-webkit-search-cancel-button{filter:grayscale(1) brightness(1.8);cursor:pointer}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.i-sm{width:18px;height:18px}
.num{font-variant-numeric:tabular-nums}

/* ── screens & overlays ── */
.screen{position:fixed;inset:0;overflow-y:auto;display:none;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.screen.on{display:block}
.overlay{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding-bottom:calc(80px + env(safe-area-inset-bottom));
  visibility:hidden;opacity:0;transform:translateY(8px);
  transition:opacity 120ms ease-in,transform 120ms ease-in,visibility 0s linear 120ms}
.overlay.on{visibility:visible;opacity:1;transform:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease),visibility 0s}

/* ── header ── */
.hd{position:sticky;top:0;z-index:5;background:var(--bg);min-height:56px;padding:6px 6px 6px 16px;padding-top:calc(6px + env(safe-area-inset-top));display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--sf2)}
.hd.has-back{padding-left:4px}
.hd h1{font-size:20px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.hd .ver{font-size:13px;color:var(--fa);padding-right:10px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:none;background:none;color:var(--fa);border-radius:50%;cursor:pointer;flex:none;
  transition-property:transform,background-color;transition-duration:150ms;transition-timing-function:ease-out}
.icon-btn:active{background:var(--sf2);transform:scale(.94)}
.icon-btn.danger{color:var(--danger)}

/* ── list ── */
.search{position:relative;margin:12px 16px 2px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fa);pointer-events:none;width:20px;height:20px}
.search input{padding-left:42px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;min-height:40px;padding:0 16px;border-radius:999px;background:var(--sf);color:var(--fa);font-size:14px;font-weight:500;cursor:pointer;border:none}
.pill.on{background:var(--ac);color:var(--ac-tx);font-weight:600}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;padding:12px 16px}
.card{border:none;text-align:left;color:inherit;width:100%;background:var(--sf);border-radius:var(--r-s);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:112px}
.card-title{font-weight:600;font-size:17px;line-height:1.35;text-wrap:balance}
.card-src{font-size:13px;color:var(--fa);display:flex;align-items:center;gap:5px;min-width:0}
.card-src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{margin-top:auto;padding-top:6px;font-size:13px;color:var(--fa);display:flex;justify-content:space-between;gap:8px}
.card-match{font-size:13px;color:var(--ac);display:flex;align-items:center;gap:5px}
.empty-state{text-align:center;padding:72px 24px;color:var(--fa);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty-state .i{width:44px;height:44px;margin-bottom:6px;opacity:.7}
.empty-state b{color:var(--tx);font-size:17px;font-weight:600}
#fab{position:fixed;right:20px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--ac-tx);border:none;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(5,7,10,.45),0 1px 3px rgba(5,7,10,.4)}
#fab .i{width:26px;height:26px}
#bot-nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--sf);display:flex;border-top:1px solid var(--sf2);height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
#bot-nav button{flex:1;background:none;border:none;color:var(--fa);font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#bot-nav button.on{color:var(--ac)}

/* ── sections & forms ── */
.section{padding:16px}
.section+.section{padding-top:4px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:44px}
.sec-hd h2{font-size:17px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.lbl{font-size:13px;color:var(--fa);font-weight:500}
.help{font-size:13px;color:var(--fa);line-height:1.5}
input,textarea,select{background:var(--sf2);color:var(--tx);border:1px solid var(--bd);border-radius:var(--r-c);padding:10px 12px;min-height:44px;font-size:16px;width:100%;outline:none;font-family:inherit;transition:border-color 150ms ease-out,box-shadow 150ms ease-out}
input::placeholder,textarea::placeholder{color:#7d8692}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
textarea{resize:vertical;min-height:120px;line-height:1.55}
select option{background:var(--sf2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:48px;padding:0 20px;border-radius:var(--r-c);border:none;cursor:pointer;font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  transition-property:transform,background-color,opacity;transition-duration:150ms;transition-timing-function:ease-out}
.btn+.btn{margin-top:8px}
.btn-primary{background:var(--ac);color:var(--ac-tx)}
.btn-ghost{background:var(--sf2);color:var(--tx)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn-sm{min-height:40px;width:auto;padding:0 14px;font-size:14px}
.text-btn{min-height:44px;padding:0 8px;background:none;border:none;color:var(--ac);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer;border-radius:var(--r-c)}
.btn:active,.pill:active,.preset:active,.dial-btn:active,.card:active,#fab:active,.step-timer:active,.cook-timer-btn:active,.cook-chip:active,.cook-nav button:active,.text-btn:active{transform:scale(.97)}
.card,.pill,.preset,.dial-btn,#fab,.step-timer,.cook-timer-btn,.cook-chip,.cook-nav button{transition-property:transform,background-color,color;transition-duration:150ms;transition-timing-function:ease-out}
button:disabled{opacity:.35;pointer-events:none}

/* ── detail: scaling controls ── */
.scale-panel{padding:14px 16px 6px}
.dial-row{display:flex;align-items:center;gap:12px}
.dial-btn{width:48px;height:48px;border-radius:50%;background:var(--sf2);border:none;color:var(--tx);cursor:pointer;display:grid;place-items:center}
.dial-val{font-size:28px;font-weight:700;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.dial-unit{color:var(--fa);font-size:15px;margin-left:-6px}
.presets{display:flex;gap:6px;padding:12px 0 4px;flex-wrap:wrap}
.preset{min-height:40px;min-width:48px;padding:0 12px;border-radius:999px;background:var(--sf2);border:none;color:var(--fa);font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.preset.on{background:var(--ac);color:var(--ac-tx);font-weight:600}
.src-row{display:flex;align-items:center;gap:10px;padding:8px 16px 4px;font-size:14px;color:var(--fa)}
.src-row .src{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.src-row .src span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.btn{text-decoration:none}

/* ── ingredients, grouped by scaling class ── */
.ing-group+.ing-group{margin-top:14px}
.ing-gh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;padding:0 0 4px;border-bottom:1px solid var(--sf2);margin-bottom:2px}
.ing-gh .ing-mult{color:var(--fa);font-weight:500;font-variant-numeric:tabular-nums}
.c-linear{color:var(--c-linear)}.c-damped{color:var(--c-damped)}.c-liquid{color:var(--c-liquid)}.c-salt{color:var(--c-salt)}.c-fixed{color:var(--c-fixed)}
.ing-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:16px}
.ing-row .amt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ── steps ── */
.step-item{background:var(--sf);border-radius:var(--r-s);padding:14px 16px;margin-bottom:10px}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.step-no{width:26px;height:26px;border-radius:50%;background:var(--sf2);color:var(--fa);font-size:13px;font-weight:600;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.step-title{font-size:15px;font-weight:600;text-wrap:balance}
.step-desc{font-size:16px;line-height:1.7;text-wrap:pretty}
.ing-ref{color:var(--ac);font-weight:600}
.step-timer{margin-top:10px;min-height:40px;padding:0 14px;border:none;border-radius:999px;background:var(--sf2);color:var(--tx);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-variant-numeric:tabular-nums}
.step-timer.running,.cook-timer-btn.running,.cook-chip{background:var(--ac-soft);color:var(--ac)}
.step-timer.done,.cook-timer-btn.done,.cook-chip.done{background:var(--ac);color:var(--ac-tx);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.memo{font-size:14px;color:var(--fa);line-height:1.6;white-space:pre-wrap}

/* ── cook mode ── */
.cook-hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 4px;padding-top:calc(6px + env(safe-area-inset-top));display:flex;align-items:center}
.cook-prog{flex:1;text-align:center;font-size:15px;color:var(--fa);font-weight:600;font-variant-numeric:tabular-nums}
.cook-bar{height:3px;background:var(--sf2)}
.cook-bar i{display:block;height:100%;background:var(--ac);transform-origin:left;transition:transform 250ms var(--ease)}
.cook-chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px}
.cook-chips:not(:empty){padding:12px 16px 0}
.cook-chip{border:none;font-size:14px;font-weight:600;min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#cook-body{padding:28px 20px 180px;touch-action:pan-y}
.cook-step-title{font-size:15px;color:var(--fa);margin-bottom:12px;font-weight:600}
.cook-step-desc{font-size:24px;line-height:1.75;text-wrap:pretty}
.cook-timer-btn{margin-top:28px;width:100%;min-height:64px;border-radius:var(--r-s);background:var(--sf2);border:none;color:var(--tx);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-variant-numeric:tabular-nums}
.cook-timer-btn .i{width:26px;height:26px}
.cook-nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--sf2)}
.cook-nav button{min-height:60px;font-size:18px;font-weight:700;border-radius:var(--r-s);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
#cook-prev{background:var(--sf2);color:var(--tx)}
#cook-next{background:var(--ac);color:var(--ac-tx)}

/* ── bottom sheet ── */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.6);display:flex;align-items:flex-end;visibility:hidden;opacity:0;transition:opacity 150ms ease-in,visibility 0s linear 150ms}
.sheet-wrap.on{visibility:visible;opacity:1;transition:opacity 180ms var(--ease),visibility 0s}
.sheet{width:100%;max-height:78vh;overflow-y:auto;background:var(--sf);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(24px);transition:transform 180ms var(--ease)}
.sheet-wrap.on .sheet{transform:none}
.sheet-grip{width:36px;height:4px;border-radius:999px;background:var(--bd);margin:4px auto 12px}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:12px}
.sheet p{font-size:15px;color:var(--fa);margin-bottom:18px;line-height:1.55}

/* ── import / review ── */
.skel-wrap{padding:20px 16px}
.skel-status{font-size:15px;font-weight:600;margin-bottom:4px}
.skel-sub{font-size:13px;color:var(--fa);margin-bottom:18px}
.skel-sub.warn{color:var(--c-damped)}
.skel{background:linear-gradient(90deg,var(--sf) 0%,var(--sf2) 50%,var(--sf) 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:var(--r-c)}
.skel-title{height:44px;margin-bottom:16px}
.skel-line{height:18px;margin:12px 0}
@keyframes shimmer{to{background-position:-200% 0}}
.err-box{display:flex;gap:10px;background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--r-s);padding:14px 16px;margin:16px;color:var(--tx);font-size:14px;white-space:pre-wrap;line-height:1.55}
.err-box .i{color:var(--danger)}
.pick-card{background:var(--sf);border-radius:var(--r-s);padding:14px;margin-bottom:10px}
.pick-card b{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
.saved-tag{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--c-linear);font-weight:500}
.review-ing-row{display:grid;grid-template-columns:1fr 1fr 1.2fr 44px;gap:6px;padding:10px 0;border-bottom:1px solid var(--sf2)}
.review-ing-row .r-ing-n{grid-column:1/4}
.review-ing-row .r-ing-del{grid-row:1/3;grid-column:4;align-self:center}
.review-ing-row input,.review-ing-row select{padding:8px 10px;font-size:15px}
.review-steps-row{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--sf2)}
.review-steps-row .col{flex:1;display:flex;flex-direction:column;gap:6px}
.review-steps-row textarea{min-height:72px;font-size:15px}
.r-step-m-wrap{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fa)}
.review-steps-row .r-step-m{width:96px}
.r-no{color:var(--fa);font-size:13px;min-width:26px;padding-top:12px;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;list-style:none;color:var(--tx);font-size:15px;font-weight:600;min-height:44px;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary .i{transition:transform 150ms ease-out;color:var(--fa)}
details[open] summary .i{transform:rotate(90deg)}

/* ── settings ── */
.set-block{background:var(--sf);border-radius:var(--r-s);padding:16px;margin:0 16px 10px}
.set-block:first-child{margin-top:16px}
.set-title{font-size:15px;font-weight:600;margin-bottom:10px}
.ok-line{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--c-linear)}
.rule-row{display:grid;grid-template-columns:72px 1fr;gap:2px 12px;padding:10px 0}
.rule-row+.rule-row{border-top:1px solid var(--sf2)}
.rule-row b{font-weight:600}
.rule-row .f{color:var(--tx);font-variant-numeric:tabular-nums}
.rule-row .ex{grid-column:2;color:var(--fa)}
.explain{font-size:14px;line-height:1.75;color:var(--fa)}
.explain p+p{margin-top:10px}
.explain strong{color:var(--tx)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);max-width:calc(100% - 32px);width:max-content;text-align:center;background:#2f353e;color:var(--tx);padding:12px 18px;border-radius:var(--r-s);font-size:15px;z-index:99;opacity:0;pointer-events:none;
  box-shadow:0 8px 24px rgba(5,7,10,.5);transition:opacity 150ms ease-out,transform 150ms ease-out}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:0s!important;animation:none!important}
  .overlay{transform:none}
}
</style>
</head>

<script>
'use strict';

// ── CONSTANTS ────────────────────────────────────────────────
const DENS = {
  '물':1,'육수':1,'다시':1,'면수':1,'국물':1,'스톡':1,
  '진간장':1.19,'국간장':1.1,'간장':1.19,
  '멸치액젓':1.1,'액젓':1.1,'참치액':1.1,
  '고추장':1.15,'된장':1.1,'쌈장':1.1,
  '굴소스':1.3,
  '고운소금':1.2,'굵은소금':0.67,'천일염':0.67,'소금':1.2,
  '식초':1.0,'미림':1.1,'청주':1.0,'맛술':1.1,'술':0.8,
  '참기름':0.92,'들기름':0.92,'올리브유':0.91,'식용유':0.91,'기름':0.91,
  '꿀':1.4,'물엿':1.4,'조청':1.35,
  '설탕':0.85,'우유':1.03,'생크림':1.0,
  '밀가루':0.56,'전분':0.65,'녹말':0.65,'빵가루':0.2,
  '고춧가루':0.3,'후춧가루':0.4,'카레가루':0.4,
};
const SALTF = {
  '고운소금':1,'굵은소금':1,'천일염':1,'소금':1,
  '진간장':0.16,'국간장':0.18,'간장':0.16,
  '멸치액젓':0.24,'액젓':0.24,'참치액':0.14,
  '된장':0.12,'고추장':0.07,'쌈장':0.1,
  '굴소스':0.14,
};
const COUNT_UNITS = new Set(['개','쪽','대','줄','장','알','포기','마리','꼬집','통','봉','묶음','병','줄기','뿌리']);
const ALL_UNITS = ['g','kg','ml','L','T','t','컵','개','쪽','대','장','알','포기','마리','꼬집','통','봉','병','줄기','뿌리'];
const ALL_CLS   = ['linear','damped','liquid','salt','fixed'];

// ── LOOKUP (longest key first) ───────────────────────────────
function lookupKey(table, name) {
  return Object.keys(table).sort((a,b)=>b.length-a.length).find(k=>name.includes(k));
}
function densOf(n){ const k=lookupKey(DENS,n); return k?DENS[k]:1; }
function saltFOf(n){ const k=lookupKey(SALTF,n); return k?SALTF[k]:null; }

// ── UNIT → GRAMS ─────────────────────────────────────────────
function grams(amt,unit,name){
  if(COUNT_UNITS.has(unit)) return null;
  if(unit==='g') return amt;
  if(unit==='kg') return amt*1000;
  const ml = unit==='T'?amt*15:unit==='t'?amt*5:unit==='컵'?amt*200:unit==='L'?amt*1000:unit==='ml'?amt:null;
  return ml!==null ? ml*densOf(name) : null;
}

// ── SALINITY ─────────────────────────────────────────────────
function calcSalinity(ings){
  let sG=0,lG=0;
  for(const i of ings){
    const g=grams(i.a,i.u,i.n); if(g==null) continue;
    const sf=saltFOf(i.n); if(sf) sG+=g*sf;
    if(i.c==='liquid'||i.c==='salt') lG+=g;
  }
  return lG>0?sG/lG*100:0;
}

// ── SCALING ──────────────────────────────────────────────────
function scaleCoef(cls,n,baseSalt,targetSalt,hasLiq){
  if(cls==='fixed') return 1;
  if(cls==='linear') return n;
  if(cls==='damped') return Math.pow(n,0.85);
  if(cls==='liquid') return Math.pow(n,0.92);
  if(cls==='salt'){
    if(!baseSalt||baseSalt<=0) return hasLiq?Math.pow(n,0.92):n; // baseSalt=0 방어
    return (hasLiq?Math.pow(n,0.92):n)*(targetSalt/baseSalt);
  }
  return n;
}
function scaleAmt(ing,n,baseSalt,targetSalt,hasLiq){
  if(COUNT_UNITS.has(ing.u)){
    const f=ing.c==='fixed'?1:ing.c==='damped'?Math.pow(n,0.85):n;
    return ing.a*f;
  }
  return ing.a*scaleCoef(ing.c,n,baseSalt,targetSalt,hasLiq);
}
function round(x){
  if(x>=100) return Math.round(x);
  if(x>=10) return Math.round(x*10)/10;
  return Math.round(x*100)/100;
}
function fmtAmt(val,unit){
  if(!isFinite(val)||isNaN(val)) return '적당량';
  if(val===0) return '소량';
  if(unit==='g'&&val>=1000) return round(val/1000)+'kg';
  if(unit==='ml'&&val>=1000) return round(val/1000)+'L';
  return round(val)+unit;
}

// ── AUTO-CLASSIFY ────────────────────────────────────────────
function autoClass(name){
  if(/물|육수|다시|면수|국물|스톡/.test(name)) return 'liquid';
  if(/소금|간장|액젓|참치액|된장|고추장|굴소스|쌈장/.test(name)) return 'salt';
  if(/마늘|생강|후추|고춧가루|파|고추|허브|술|청주|미림|맛술|식초|기름|참기름|들기름|참깨|깨/.test(name)) return 'damped';
  return 'linear';
}

// ── DATABASE ─────────────────────────────────────────────────
let _db;
function getDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('damda',1);
    r.onupgradeneeded=e=>e.target.result.createObjectStore('recipes',{keyPath:'id'});
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=()=>rej(r.error);
  });
}
async function dbAll(){ const db=await getDB(); return new Promise((r,j)=>{ const q=db.transaction('recipes','readonly').objectStore('recipes').getAll(); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); }); }
async function dbGet(id){ const db=await getDB(); return new Promise((r,j)=>{ const q=db.transaction('recipes','readonly').objectStore('recipes').get(id); q.onsuccess=()=>r(q.result); q.onerror=()=>j(q.error); }); }
async function dbPut(rec){ const db=await getDB(); return new Promise((r,j)=>{ const q=db.transaction('recipes','readwrite').objectStore('recipes').put(rec); q.onsuccess=()=>r(); q.onerror=()=>j(q.error); }); }
async function dbDel(id){ const db=await getDB(); return new Promise((r,j)=>{ const q=db.transaction('recipes','readwrite').objectStore('recipes').delete(id); q.onsuccess=()=>r(); q.onerror=()=>j(q.error); }); }

// ── TOAST ────────────────────────────────────────────────────
let _toastTimer;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>el.classList.remove('show'),2500);
}

// ── NAV ──────────────────────────────────────────────────────
function showTab(tab){
  ['list','settings'].forEach(t=>{
    document.getElementById('s-'+t).classList.toggle('on',t===tab);
    document.getElementById('nav-'+t).classList.toggle('on',t===tab);
  });
  document.getElementById('fab').style.display=tab==='list'?'':'none';
  if(tab==='list') renderList();
  if(tab==='settings') renderSettings();
}

// ── GEMINI ───────────────────────────────────────────────────
function getKey(){ return window.DAMDA_CONFIG?.geminiKey||localStorage.getItem('gemini-key')||''; }

async function geminiCall(parts){
  const key=getKey();
  if(!key||key==='YOUR_GEMINI_KEY_HERE') throw new Error('Gemini API 키가 없습니다.\n설정에서 API 키를 입력해 주세요.');
  const isVideo=parts.some(p=>p.fileData);
  console.log('[Gemini] 요청 시작', isVideo?'(영상 모드)':'(텍스트 모드)');
  const res=await fetch(
    'https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key='+key,
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}]})}
  );
  if(!res.ok){
    const e=await res.json().catch(()=>({}));
    console.error('[Gemini] 오류', res.status, e?.error?.message);
    throw new Error(e?.error?.message||'Gemini 오류 '+res.status);
  }
  const data=await res.json();
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'';
  console.log('[Gemini] 응답', text.slice(0,200)+'…');
  if(!text) throw new Error('Gemini 응답이 비어 있습니다.');
  return text;
}

function extractJSON(text){
  const m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  try{ return JSON.parse(m?m[1].trim():text.trim()); }
  catch(e){ throw new Error('JSON 파싱 실패:\n'+text.slice(0,200)); }
}

const SCHEMA=`JSON 코드블록으로만 응답. 레시피가 여러 개면 모두 추출:
\`\`\`json
{
  "recipes": [
    {
      "title":"요리명",
      "cuisine":"한식|중식|일식|양식|동남아식|기타 중 하나",
      "servings":인분(정수),
      "dish":"국|탕|찌개|전골|조림|볶음|구이|무침|나물|샐러드|튀김|찜|면|밥|죽|기타 중 하나",
      "source":"출처/채널명",
      "ings":[{"n":"재료명","a":숫자,"u":"단위","c":"분류"}],
      "steps":[{"t":"단계명","d":"설명","m":타이머분}],
      "memo":""
    }
  ]
}
\`\`\`
레시피가 1개여도 반드시 recipes 배열로 감싸서 반환.
단위: g kg ml L T(큰술=15ml) t(작은술=5ml) 컵(200ml) 병(750ml와인/소주는 병) 개 쪽 대 장 알 포기 마리 꼬집 통 봉 줄기 뿌리
분류: linear(주재료-고기/채소/면/두부) damped(향신료-마늘/생강/기름/술/식초) liquid(물/육수/다시물) salt(소금/간장/액젓/된장/고추장/굴소스) fixed(인분무관)
타이머: 조리 시간(분), 없으면 0
중요 규칙:
- a는 반드시 숫자. 적당량/약간/조금은 소량이면 a:1 u:t, 아예 모르면 a:0
- 병/캔 단위는 u:"병" u:"통" 으로. 1병=750ml로 ml 변환하지 말것
- 총 분량 기준으로 기재 (1인분이 아닌 recipe.servings 전체 기준)
- kg는 kg로, 1.5kg → a:1.5 u:kg (g로 변환하지 말것)
- 주재료(고기/생선) 양은 특히 정확히. 영상에서 저울/포장지에 표시된 숫자 우선
- servings는 영상에서 명시한 인분 수. 불명확하면 재료 총량으로 추정
- 영상 설명란 텍스트가 제공된 경우 재료 분량은 그 값을 최우선으로 사용`;

// YouTube URL → { id, isShorts }
function extractVideoId(url){
  const m=url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  return m?m[1]:null;
}
function isYouTubeShorts(url){
  return /youtube\.com\/shorts\//.test(url);
}

// ── NORMALIZE parse result → always Recipe[] ─────────────────
function normalizeRecipes(result){
  if(Array.isArray(result)) return result;
  if(Array.isArray(result?.recipes)) return result.recipes;
  return [result]; // 구형 단일 객체 호환
}

// ── PARSE FROM TEXT ───────────────────────────────────────────
async function parseFromText(raw){
  const text=raw.slice(0,8000);
  const r=await geminiCall([{text:'다음 요리 자막에서 레시피를 모두 추출해.\n\n자막:\n'+text+'\n\n'+SCHEMA}]);
  return normalizeRecipes(extractJSON(r));
}

// ── PARSE FROM YOUTUBE VIDEO ──────────────────────────────────
async function parseFromVideo(videoId, extraDesc='', isShorts=false){
  console.log('[YouTube] 영상 분석 시작 videoId='+videoId+(isShorts?' (Shorts)':''));
  const fileUri=isShorts
    ?'https://www.youtube.com/shorts/'+videoId
    :'https://www.youtube.com/watch?v='+videoId;
  const filePart={fileData:{mimeType:'video/*',fileUri}};
  const descNote=extraDesc
    ? '\n\n아래는 영상 설명/댓글 텍스트입니다. 여러 요리가 있으면 각각 별도 레시피로 추출하고, 재료 분량은 이 텍스트의 값을 최우선으로 사용하세요:\n"""\n'+extraDesc+'\n"""'
    : '\n\n영상에 메인 요리 외 곁들임 요리(side dish), 소스, 퓨레, 가니쉬 등이 별도로 나오면 각각 별도 레시피로 추출해.';
  const textPart={text:'이 요리 영상에서 나오는 레시피를 모두 추출해.'+descNote+'\n\n'+SCHEMA};
  const r=await geminiCall([filePart,textPart]);
  const recipes=normalizeRecipes(extractJSON(r));
  console.log('[YouTube] 파싱 완료', recipes.map(r=>r.title).join(', '));
  return recipes;
}

let allRecipes=[];
let activeFilter='전체';
let searchQuery='';

async function renderList(){
  allRecipes=await dbAll();
  allRecipes.sort((a,b)=>(b.savedAt||0)-(a.savedAt||0));

  // filter pills
  const cuisines=['전체',...new Set(allRecipes.map(r=>r.cuisine).filter(Boolean))];
  const pillsEl=document.getElementById('filter-pills');
  pillsEl.innerHTML='';
  pillsEl.style.display=allRecipes.length?'':'none';
  cuisines.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='pill'+(c===activeFilter?' on':'');
    btn.textContent=c;
    btn.onclick=()=>{ activeFilter=c; renderList(); };
    pillsEl.appendChild(btn);
  });

  // filter + search
  const q=searchQuery.toLowerCase();
  const shown=allRecipes.filter(r=>{
    if(activeFilter!=='전체'&&r.cuisine!==activeFilter) return false;
    if(q){
      const inTitle=r.title?.toLowerCase().includes(q);
      const inIngs=r.ings?.some(i=>i.n?.toLowerCase().includes(q));
      if(!inTitle&&!inIngs) return false;
    }
    return true;
  });

  const grid=document.getElementById('recipe-grid');
  const empty=document.getElementById('list-empty');
  if(!shown.length){
    grid.innerHTML='';
    empty.innerHTML=allRecipes.length
      ? ic('magnifying-glass')+'<b>찾는 레시피가 없습니다</b><div>다른 이름이나 재료로 검색해 보세요</div>'
      : ic('cooking-pot')+'<b>아직 레시피가 없습니다</b><div>아래 + 버튼으로 첫 레시피를 가져오세요</div>';
    empty.style.display='';
    return;
  }
  empty.style.display='none';
  grid.innerHTML='';
  shown.forEach(r=>{
    const inTitle=!q||r.title?.toLowerCase().includes(q);
    const matchedIng=q&&!inTitle?r.ings?.find(i=>i.n?.toLowerCase().includes(q)):null;
    const card=document.createElement('button');
    card.className='card';
    card.innerHTML='<div class="card-title">'+esc(r.title||'제목없음')+'</div>'
      +(r.source?'<div class="card-src">'+(r.sourceUrl?ic('youtube-logo','i-sm'):'')+'<span>'+esc(r.source)+'</span></div>':'')
      +(matchedIng?'<div class="card-match">'+ic('magnifying-glass','i-sm')+esc(matchedIng.n)+'</div>':'')
      +'<div class="card-meta"><span>'+esc([r.cuisine,r.dish].filter(Boolean).join(' '))+'</span><span class="num">'+esc(r.servings||'')+'인분</span></div>';
    card.onclick=()=>openDetail(r.id);
    grid.appendChild(card);
  });
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── WAKE LOCK (한 번만 요청, 닫을 때 해제, 앱 복귀 시 재요청) ──
let wakeSentinel=null,wakeWanted=false;
async function wakeOn(){
  wakeWanted=true;
  if(!navigator.wakeLock||wakeSentinel) return;
  try{
    wakeSentinel=await navigator.wakeLock.request('screen');
    wakeSentinel.addEventListener('release',()=>{ wakeSentinel=null; });
  }catch(e){}
}
function wakeOff(){
  wakeWanted=false;
  if(wakeSentinel){ wakeSentinel.release().catch(()=>{}); wakeSentinel=null; }
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&wakeWanted) wakeOn();
});

// ── TIMERS (단계별, 상세·조리 모드 공용, 단계 이동해도 유지) ───
const timers={};   // stepIdx -> {end, min, done}
let timerTick=null,audioCtx=null;
function ensureAudio(){
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
function beep(){
  if(!audioCtx) return;
  const t0=audioCtx.currentTime;
  for(let k=0;k<3;k++){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
    const s=t0+k*0.45;
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.4,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.3);
    o.start(s); o.stop(s+0.32);
  }
}
function timerAlarm(idx){
  if(navigator.vibrate) navigator.vibrate([400,200,400,200,400]);
  beep();
  toast((idx+1)+'단계 타이머 완료');
}
function timerToggle(idx,min){
  const t=timers[idx];
  if(t) delete timers[idx];                       // 실행 중이면 취소, 완료 상태면 초기화
  else{ timers[idx]={end:Date.now()+min*60000,min,done:false}; ensureAudio(); }
  if(!timerTick&&Object.keys(timers).length) timerTick=setInterval(tickTimers,250);
  tickTimers();
}
function timerLeft(t){ return Math.max(0,Math.ceil((t.end-Date.now())/1000)); }
function fmtClock(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function tickTimers(){
  for(const [idx,t] of Object.entries(timers)){
    if(!t.done&&timerLeft(t)<=0){ t.done=true; timerAlarm(+idx); }
  }
  paintTimers();
  if(!Object.values(timers).some(t=>!t.done)&&timerTick){ clearInterval(timerTick); timerTick=null; }
}
function clearTimers(){
  for(const k of Object.keys(timers)) delete timers[k];
  if(timerTick){ clearInterval(timerTick); timerTick=null; }
}
function timerBtnHTML(cls,idx,min){
  return '<button class="'+cls+'" data-timer="'+idx+'" data-min="'+min+'">'+ic('timer')+'<span class="t-label">'+min+'분</span></button>';
}
function paintTimers(){
  document.querySelectorAll('[data-timer]').forEach(btn=>{
    const idx=+btn.dataset.timer,t=timers[idx];
    btn.classList.toggle('running',!!t&&!t.done);
    btn.classList.toggle('done',!!t&&t.done);
    const label=btn.querySelector('.t-label');
    if(label) label.textContent=!t?btn.dataset.min+'분':t.done?'완료':fmtClock(timerLeft(t));
  });
  paintCookChips();
}

async function loadDetail(){

  if(!r){ closeDetail(); return; }
  detailServings=r.servings||2;
  const baseSalt=calcSalinity(r.ings||[]);
  detailTargetSalt=baseSalt||1.0;   // 목표염도 = 원본염도 (간 조절 UI 없음)

  renderDetail(r,baseSalt);

// 현재 인분·염도 기준의 포맷터와 분류별 배율
function scaleCtx(r,baseSalt){
  const n=detailServings/(r.servings||1);
  const tSalt=detailTargetSalt;
  const hasLiq=(r.ings||[]).some(i=>i.c==='liquid');
  return {
    fmt:ing=>fmtAmt(scaleAmt(ing,n,baseSalt,tSalt,hasLiq),ing.u),
    coef:cls=>scaleCoef(cls,n,baseSalt,tSalt,hasLiq),
  };
}

// 재료를 스케일 분류별로 묶어서 표시 (분류 = 이 앱의 핵심 아이디어)
function ingGroupsHTML(ings,ctx){
  let html='';
  ALL_CLS.forEach(cls=>{
    const items=ings.map((ing,i)=>({ing,i})).filter(x=>clsOf(x.ing.c)===cls);
    if(!items.length) return;
    html+='<div class="ing-group"><div class="ing-gh c-'+cls+'"><span>'+CLS_LABEL[cls]+'</span>'
      +'<span class="ing-mult" data-cls="'+cls+'"></span></div>';
    items.forEach(({ing,i})=>{
      html+='<div class="ing-row"><span>'+esc(ing.n)+'</span><span class="amt" data-i="'+i+'">'+ctx.fmt(ing)+'</span></div>';
    });
    html+='</div>';
  });
  return html;
}
function paintMults(root,ctx){
  root.querySelectorAll('.ing-mult').forEach(el=>{
    const k=ctx.coef(el.dataset.cls);
    el.textContent=Math.abs(k-1)<0.005?'':'×'+(+k.toFixed(2));
  });
}

// 구조는 한 번만 그리고, 인분·염도 변경 시에는 숫자만 갱신 (슬라이더 드래그 유지)
function renderDetail(r,baseSalt){
  const ings=r.ings||[],steps=r.steps||[];
  const body=document.getElementById('detail-body');
  const ctx=scaleCtx(r,baseSalt);

  let html='<div class="scale-panel">'
    +'<div class="dial-row">'
    +'<button class="dial-btn" id="dial-minus" aria-label="1인분 줄이기">'+ic('minus')+'</button>'
    +'<span class="dial-val" id="dial-val">'+detailServings+'</span><span class="dial-unit">인분</span>'
    +'<button class="dial-btn" id="dial-plus" aria-label="1인분 늘리기">'+ic('plus')+'</button>'
    +'</div><div class="presets">';
  [1,2,4,6,8].forEach(p=>{ html+='<button class="preset" data-p="'+p+'">'+p+'인</button>'; });
  html+='</div>';
  html+='</div>';

  if(r.source||r.sourceUrl){
    html+='<div class="src-row"><span class="src">'+(r.sourceUrl?ic('youtube-logo','i-sm'):'')+'<span>'+esc(r.source||'원본 영상')+'</span></span>'
      +(r.sourceUrl?'<a class="btn btn-ghost btn-sm" href="'+esc(r.sourceUrl)+'" target="_blank" rel="noopener">'+ic('play','i-sm')+'영상 보기</a>':'')
      +'</div>';
  }

  html+='<div class="section"><div class="sec-hd"><h2>재료</h2></div>'+ingGroupsHTML(ings,ctx)+'</div>';

  html+='<div class="section"><div class="sec-hd"><h2>조리 순서</h2>'
    +(steps.length?'<button class="btn btn-primary btn-sm" id="btn-cook-start">'+ic('play','i-sm')+'조리 시작</button>':'')
    +'</div>';
  steps.forEach((step,i)=>{
    html+='<div class="step-item"><div class="step-head"><span class="step-no">'+(i+1)+'</span>'
      +(step.t?'<span class="step-title">'+esc(step.t)+'</span>':'')+'</div>'
      +'<div class="step-desc">'+formatStepDesc(step.d||'',ings,ctx.fmt)+'</div>'
      +(step.m>0?timerBtnHTML('step-timer',i,step.m):'')
      +'</div>';
  });
  html+='</div>';

  if(r.memo){ html+='<div class="section"><div class="sec-hd"><h2>메모</h2></div><div class="memo">'+esc(r.memo)+'</div></div>'; }

  body.innerHTML=html;

  const refresh=()=>updateAmounts(r,baseSalt);
  document.getElementById('dial-minus').onclick=()=>{ detailServings=Math.max(1,detailServings-1); refresh(); };
  document.getElementById('dial-plus').onclick=()=>{ detailServings++; refresh(); };
  body.querySelectorAll('.preset').forEach(btn=>{
    btn.onclick=()=>{ detailServings=parseInt(btn.dataset.p); refresh(); };
  });
  body.querySelectorAll('[data-timer]').forEach(btn=>{
    btn.onclick=()=>timerToggle(+btn.dataset.timer,+btn.dataset.min);
  });
  const cookBtn=document.getElementById('btn-cook-start');
  if(cookBtn) cookBtn.onclick=()=>openCook(r,baseSalt);

  refresh();
  paintTimers();
}

function updateAmounts(r,baseSalt){
  const ctx=scaleCtx(r,baseSalt);
  const ings=r.ings||[];
  const body=document.getElementById('detail-body');
  document.getElementById('dial-val').textContent=detailServings;
  body.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',+b.dataset.p===detailServings));
  body.querySelectorAll('[data-i]').forEach(el=>{
    const ing=ings[+el.dataset.i]; if(!ing) return;
    el.textContent=el.classList.contains('ing-ref')?ing.n+' '+ctx.fmt(ing):ctx.fmt(ing);
  });
  paintMults(body,ctx);
}

function formatStepDesc(desc,ings,fmtFn){
  return esc(desc).replace(/\{([^}]+)\}/g,(m,name)=>{
    const i=ings.findIndex(x=>x.n===name);
    return i>=0?('<strong class="ing-ref" data-i="'+i+'">'+esc(name)+' '+fmtFn(ings[i])+'</strong>'):esc(name);
  });
}

// 다른 단계에서 돌고 있는 타이머를 헤더 칩으로 표시 (탭하면 그 단계로 이동)
function paintCookChips(){
  const box=document.getElementById('cook-chips');
  if(!box) return;
  if(!cookRecipe){ box.innerHTML=''; return; }
  const items=Object.entries(timers).filter(([idx])=>+idx!==cookStep);
  box.innerHTML=items.map(([idx,t])=>
    '<button class="cook-chip'+(t.done?' done':'')+'" data-go="'+idx+'">'+ic('timer','i-sm')+(+idx+1)+'단계 '+(t.done?'완료':fmtClock(timerLeft(t)))+'</button>'
  ).join('');
  box.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>renderCookStep(+b.dataset.go));
}

function renderCookStep(idx){
  if(!cookRecipe) return;
  const steps=cookRecipe.steps||[];
  cookStep=Math.max(0,Math.min(idx,steps.length-1));
  const step=steps[cookStep];
  const total=steps.length;
  const isLast=cookStep===total-1;

  document.getElementById('cook-prog').textContent=(cookStep+1)+' / '+total;
  document.getElementById('cook-bar').style.transform='scaleX('+((cookStep+1)/total)+')';
  document.getElementById('cook-prev').disabled=cookStep===0;
  document.getElementById('cook-next').innerHTML=isLast?ic('check')+'완료':'다음'+ic('arrow-right');

  let html=(step.t?'<div class="cook-step-title">'+esc(step.t)+'</div>':'')
    +'<div class="cook-step-desc">'+formatStepDesc(step.d||'',cookRecipe.ings||[],cookCtx.fmt)+'</div>';
  if(step.m>0) html+=timerBtnHTML('cook-timer-btn',cookStep,step.m);
  document.getElementById('cook-body').innerHTML=html;
  document.getElementById('s-cook').scrollTo(0,0);

  const tbtn=document.querySelector('#cook-body [data-timer]');
  if(tbtn) tbtn.onclick=()=>timerToggle(cookStep,step.m);
  paintTimers();
}

function openCookIngs(){
  if(!cookRecipe) return;
  openSheet('<h3>재료</h3>'+ingGroupsHTML(cookRecipe.ings||[],cookCtx)
    +'<button class="btn btn-ghost" id="sheet-close" style="margin-top:16px">닫기</button>');
  paintMults(document.getElementById('sheet-body'),cookCtx);
  document.getElementById('sheet-close').onclick=()=>closeSheet(false);
}

// 좌우 스와이프로 단계 이동
(()=>{
  const el=document.getElementById('cook-body');
  let x0=null,y0=null;
  el.addEventListener('touchstart',e=>{ const t=e.touches[0]; x0=t.clientX; y0=t.clientY; },{passive:true});
  el.addEventListener('touchend',e=>{
    if(x0===null) return;
    const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    x0=null;
    if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)*0.6) return;
    if(dx<0&&cookStep<(cookRecipe?.steps||[]).length-1) renderCookStep(cookStep+1);
    if(dx>0&&cookStep>0) renderCookStep(cookStep-1);
  },{passive:true});
})();

    +'</div>'

    const vid=extractVideoId(url);

    let desc=document.getElementById('yt-desc')?.value.trim()||'';
    let infoMsg=desc?'직접 입력한 설명 포함':'';
    // 설명란이 비어 있으면 서버에서 자동 가져오기 시도
    if(!desc){
      document.getElementById('import-body').innerHTML=skeletonHTML('영상 정보 가져오는 중');
      try{
        const ctrl=new AbortController();
        setTimeout(()=>ctrl.abort(),15000);
        const r=await fetch('/api/info?v='+vid,{signal:ctrl.signal});
        if(r.ok){
          const d=await r.json();
          console.log('[서버] /api/info 응답:', d);
          const parts=[];
          if(d.description) parts.push('=== 영상 설명 ===\n'+d.description);
          if(d.pinned_comments?.length) parts.push('=== 고정/크리에이터 댓글 ===\n'+d.pinned_comments.join('\n---\n'));
          if(d.top_comments?.length) parts.push('=== 인기 댓글 (참고) ===\n'+d.top_comments.slice(0,5).join('\n---\n'));
          desc=parts.join('\n\n');
          const found=[];
          if(d.description) found.push('설명란');
          if(d.pinned_comments?.length) found.push('고정댓글 '+d.pinned_comments.length+'개');
          if(d.top_comments?.length) found.push('상위댓글 '+d.top_comments.length+'개');
          infoMsg=found.length?found.join(', ')+' 포함':'설명과 댓글이 없어 영상만 분석합니다';
          if(desc) console.log('[서버] 설명 포함 ('+desc.length+'자):', desc.slice(0,300));
          else console.warn('[서버] 설명/댓글 없음, 영상만 분석');
        } else {
          infoMsg='서버 오류('+r.status+')로 영상만 분석합니다';
          console.warn('[서버] /api/info 실패:', r.status);
        }
      }catch(e){
        infoMsg='서버가 꺼져 있어 영상만 분석합니다';
        console.warn('[서버] 연결 실패:', e.message);
      }
    }
    currentSourceUrl=url;
    await runParse(()=>parseFromVideo(vid,desc,shorts), infoMsg);
  };

    const raw=document.getElementById('paste-input')?.value.trim();
    if(!raw){ toast('자막을 붙여넣으세요'); return; }
    currentSourceUrl='';
    await runParse(()=>parseFromText(raw));

async function runParse(parseFn, statusMsg=''){
  const body=document.getElementById('import-body');
  body.innerHTML=skeletonHTML('Gemini가 분석하는 중',statusMsg,/오류|꺼져|없어/.test(statusMsg));
  try{
    const recipes=await parseFn();
    if(recipes.length>1){
      renderRecipeSelect(recipes);
    } else {
      renderReview(recipes[0]);
    }
  }catch(e){
    body.innerHTML='<div class="err-box">'+ic('warning-circle')+'<div>'+esc(e.message)+'</div></div>'
      +'<div class="section"><button class="btn btn-ghost" id="btn-retry">'+ic('arrow-left','i-sm')+'다시 시도</button></div>';
    document.getElementById('btn-retry').onclick=renderImportStep1;
  }
}

  const body=document.getElementById('import-body');

      +'<div class="help num" style="margin-bottom:10px">'

async function deleteRecipe(id,title){
  const ok=await confirmSheet('레시피 삭제',(title||'이 레시피')+'를 삭제할까요? 되돌릴 수 없습니다.','삭제');
  if(!ok) return;
  await dbDel(id);
  editingId=null;
  closeImport();
  closeDetail();
  await renderList();
  toast('삭제했습니다');
}

let editingId=null;
let multiRecipes=null;
let multiIdx=null;
let currentSourceUrl='';

function openEdit(recipe){
  editingId=recipe.id;
  document.getElementById('s-import').classList.add('on');
  renderReview(recipe);
}

async function saveReview(){
  const title=document.getElementById('r-title').value.trim();
  if(!title){ toast('제목을 입력하세요'); return; }

  const ings=[...document.querySelectorAll('#ing-rows .review-ing-row')].map(row=>({
    n: row.querySelector('.r-ing-n').value.trim(),
    a: parseFloat(row.querySelector('.r-ing-a').value)||0,
    u: row.querySelector('.r-ing-u').value,
    c: row.querySelector('.r-ing-c').value,
  })).filter(i=>i.n);

  const steps=[...document.querySelectorAll('#step-rows .review-steps-row')].map(row=>({
    t: row.querySelector('.r-step-t')?.value.trim()||'',
    d: row.querySelector('.r-step-d')?.value.trim()||'',
    m: parseInt(row.querySelector('.r-step-m')?.value)||0,
  })).filter(s=>s.d);

  const recipe={
    id: editingId||'r_'+Date.now(),
    title,
    cuisine: document.getElementById('r-cuisine').value,
    servings: parseInt(document.getElementById('r-servings').value)||2,
    dish: document.getElementById('r-dish').value,
    source: document.getElementById('r-source').value.trim(),
    sourceUrl: document.getElementById('r-source-url')?.value||'',
    memo: document.getElementById('r-memo').value.trim(),
    ings, steps,
    savedAt: Date.now(),
  };

  await dbPut(recipe);
  const wasEditing=!!editingId;
  editingId=null;
  await renderList();
  toast(title+(wasEditing?' 수정했습니다':' 저장했습니다'));

  // 다중 레시피 선택 중이면 → 선택 화면으로 복귀
  if(multiRecipes&&multiIdx!==null){
    multiRecipes[multiIdx]._saved=true;
    const remaining=multiRecipes.filter(r=>!r._saved);
    if(remaining.length>0){
      renderRecipeSelect(multiRecipes);
      return;
    } else {
      multiRecipes=null; multiIdx=null;
      closeImport();
      return;
    }
  }

  if(wasEditing&&detailId) await loadDetail();
  closeImport();
}

    +rule('salt','× n<sup>0.92</sup>','소금, 간장, 액젓, 된장, 굴소스. 국물이 없는 요리는 × n')
    +rule('fixed','× 1','인분과 무관한 재료')
    +'<p><strong>물·국물이 n<sup>0.92</sup>인 이유.</strong> 증발량은 부피가 아니라 표면적과 시간에 비례합니다. 큰 냄비는 부피에 비해 덜 졸아들어서, 2배 만들 때 물을 2배 넣으면 싱거워집니다.</p>'
    +'<p><strong>향신·양념이 n<sup>0.85</sup>인 이유.</strong> 향과 자극은 비선형으로 느껴집니다. 마늘을 2배 넣으면 2배보다 강하게 느껴집니다.</p>'
    +'<p><strong>간이 n<sup>0.92</sup>인 이유.</strong> 소금은 인분이 아니라 국물 양을 따라갑니다. 계수는 모두 근사치입니다.</p>'
    +'</div></details></div>'

    +'<div class="set-block">'
    +'<div class="set-title">데이터 초기화</div>'
    +'<button class="btn btn-danger" id="btn-clear">'+ic('trash','i-sm')+'모든 레시피 삭제</button>'
    +'</div>';

  document.getElementById('btn-save-key').onclick=()=>{
    const k=document.getElementById('key-input').value.trim();
    if(k) localStorage.setItem('gemini-key',k); else localStorage.removeItem('gemini-key');
    toast('저장했습니다');
  };

  document.getElementById('btn-export').onclick=async()=>{
    const data=await dbAll();
    const blob=new Blob([JSON.stringify({version:1,recipes:data},null,2)],{type:'application/json'});
    const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:'damda-recipes.json'});
    a.click(); URL.revokeObjectURL(a.href);
    toast('레시피 '+data.length+'개를 내보냈습니다');
  };

  document.getElementById('file-import').onchange=async(e)=>{
    const file=e.target.files[0]; if(!file) return;
    try{
      const text=await file.text();
      const data=JSON.parse(text);
      const recipes=data.recipes||data;
      if(!Array.isArray(recipes)) throw new Error('올바른 형식이 아닙니다');
      for(const r of recipes) await dbPut(r);
      await renderList();
      toast('레시피 '+recipes.length+'개를 가져왔습니다');
    }catch(err){ toast('가져오기 실패: '+err.message); }
    e.target.value='';
  };

  document.getElementById('btn-clear').onclick=async()=>{
    const all=await dbAll();
    const ok=await confirmSheet('모든 레시피 삭제','레시피 '+all.length+'개가 모두 삭제됩니다. 먼저 JSON으로 내보내 두는 것을 권합니다.','모두 삭제');
    if(!ok) return;
    for(const r of all) await dbDel(r.id);
    await renderList();
    toast('모두 삭제했습니다');
  };
}

// ── INIT ─────────────────────────────────────────────────────
document.getElementById('detail-back').onclick=closeDetail;
document.getElementById('import-back').onclick=()=>{ editingId=null; closeImport(); };
document.getElementById('cook-close').onclick=closeCook;
document.getElementById('cook-ings').onclick=openCookIngs;
document.getElementById('cook-prev').onclick=()=>renderCookStep(cookStep-1);
document.getElementById('cook-next').onclick=()=>{ if(cookStep===(cookRecipe?.steps||[]).length-1) closeCook(); else renderCookStep(cookStep+1); };
document.getElementById('fab').onclick=()=>{ editingId=null; openImport(); };
document.getElementById('detail-edit').onclick=async()=>{
  if(!detailId) return;
  const r=await dbGet(detailId);
  if(r) openEdit(r);
};
document.getElementById('search-input').oninput=e=>{
  searchQuery=e.target.value;
  renderList();
};

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

renderList();
</script>
</body>
</html>
